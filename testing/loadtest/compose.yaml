# End-to-end rate-limiter load test topology. Mirrors production: one hub with
# its Redis, and two edges that each hold one mTLS gRPC connection to the hub
# and keep their caches in memory. (Analytics, and so NATS, are off.)
# Driven by testing/loadtest/run.sh; certs come from deploy/gen-dev-certs.sh.
name: gate-lt

x-edge-env: &edge-env
  PORT: ":8080"
  HUB_GRPC_ADDR: hub-server:9090
  HUB_GRPC_SERVER_NAME: hub-server
  GATE_ANALYTICS_ENABLED: "false"
  EDGE_TLS_CERT_FILE: /certs/edge/tls.crt
  EDGE_TLS_KEY_FILE: /certs/edge/tls.key
  EDGE_TLS_CA_FILE: /certs/ca/ca.crt

x-edge: &edge
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  image: gate-lt
  command: ["edge"]
  cpus: 2.0
  depends_on:
    hub-server:
      condition: service_healthy
  volumes:
    - ${LT_CERT_DIR:?set LT_CERT_DIR}/edge:/certs/edge:ro
    - ${LT_CERT_DIR}/ca:/certs/ca:ro
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  hub-redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", ""]

  hub-server:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: gate
    image: gate-lt
    command: ["hub"]
    cpus: 2.0
    depends_on: [hub-redis]
    environment:
      PORT: "8080"
      HUB_GRPC_PORT: "9090"
      REDIS_ADDR: hub-redis:6379
      HUB_AUTH_TOKEN: ${LT_HUB_TOKEN:-loadtest-token}
      HUB_GRPC_CLIENT_AUTH_MODE: require-and-verify
      CONFIG_FILE_PATH: /config/gateway-config.json
      HUB_TLS_CERT_FILE: /certs/hub/tls.crt
      HUB_TLS_KEY_FILE: /certs/hub/tls.key
      HUB_TLS_CA_FILE: /certs/ca/ca.crt
    volumes:
      - ./gateway-config.loadtest.yaml:/config/gateway-config.json:ro
      - ${LT_CERT_DIR}/hub:/certs/hub:ro
      - ${LT_CERT_DIR}/ca:/certs/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  edge-1:
    <<: *edge
    environment:
      <<: *edge-env
      EDGE_ID: edge-1
  edge-2:
    <<: *edge
    environment:
      <<: *edge-env
      EDGE_ID: edge-2

  # Minimal origin ("ok") so measurements reflect gateway overhead only.
  upstream:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: tools
    image: gate-lt-tools
    command: ["upstream"]

  loadgen:
    image: gate-lt-tools
    profiles: ["tools"]
    cpus: 4.0
    entrypoint: ["loadgen"]
    environment:
      HUB_AUTH_TOKEN: ${LT_HUB_TOKEN:-loadtest-token}
    volumes:
      - .:/lt:ro
      - ./results:/results
