version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - io.WriteString
  exclusions:
    presets: [std-error-handling, common-false-positives]
    paths:
      - packages/common/types/.*\.pb\.go
    rules:
      - linters: [staticcheck]
        text: "QF1001" # De Morgan rewrites: a negated conjunction often reads closer to the rule
      - path: _test\.go
        linters: [errcheck, bodyclose]
formatters:
  enable: [gofmt]
