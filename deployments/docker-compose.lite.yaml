services:
  hub-mongo:
    image: mongo:7.0
    container_name: hub-mongo
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=gateway_db
    volumes:
      - mongo_data:/data/db

  hub-redis:
    image: redis:7-alpine
    container_name: hub-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy volatile-lfu
    volumes:
      - hub_redis_data:/data

  edge-redis:
    image: redis:7-alpine
    container_name: edge-redis
    command: >
      redis-server
      --maxmemory-policy volatile-lfu
    volumes:
      - edge_redis_data:/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  hub-server:
    build:
      context: ..
      dockerfile: deployments/hub.Dockerfile
    container_name: hub-server
    depends_on:
      - hub-redis
      - hub-mongo
      - kafka
    environment:
      - REDIS_ADDR=hub-redis:6379
      - MONGO_URI=mongodb://hub-mongo:27017
      - DB_NAME=gateway_db
      - CONFIG_FILE_PATH=/cmd/config.json
      - HUB_AUTH_TOKEN=${HUB_AUTH_TOKEN:?HUB_AUTH_TOKEN is required}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_RATE_TOPIC=${KAFKA_RATE_TOPIC:-rate-updates}
      - KAFKA_RATE_GROUP=${KAFKA_RATE_GROUP:-hub-rate-consumers}
      - KAFKA_SOT_TOPIC=${KAFKA_SOT_TOPIC:-rate-sot}
      - KAFKA_TIER_UPDATES_TOPIC=${KAFKA_TIER_UPDATES_TOPIC:-tier-updates}
    ports:
      - "8080:8080"

  edge-server:
    build:
      context: ..
      dockerfile: deployments/edge.Dockerfile
    container_name: edge-server
    depends_on:
      - hub-server
      - edge-redis
      - kafka
    environment:
      - REDIS_ADDR=edge-redis:6379
      - HUB_ADDR=http://hub-server:8080
      - HUB_AUTH_TOKEN=${HUB_AUTH_TOKEN:?HUB_AUTH_TOKEN is required}
      - EDGE_MAX_DELTA=${EDGE_MAX_DELTA:-100}
      - ANALYTICS_ENABLED=false
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - KAFKA_RATE_TOPIC=${KAFKA_RATE_TOPIC:-rate-updates}
      - KAFKA_SOT_TOPIC=${KAFKA_SOT_TOPIC:-rate-sot}
      - KAFKA_TIER_UPDATES_TOPIC=${KAFKA_TIER_UPDATES_TOPIC:-tier-updates}
      - KAFKA_EDGE_GROUP=${KAFKA_EDGE_GROUP:-edge-consumers}
      - PORT=:8080
    ports:
      - "8082:8080"

volumes:
  hub_redis_data:
  edge_redis_data:
  mongo_data:
