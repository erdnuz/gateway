services:
  # --- HUB INFRASTRUCTURE ---
  hub-redis:
    image: redis:7-alpine
    container_name: hub-redis
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec 
      --maxmemory-policy noeviction
    volumes:
      - hub_redis_data:/data
    ports:
      - "6379:6379"

  edge-redis:
    image: redis:7-alpine
    container_name: edge-redis
    command: >
      redis-server
      --maxmemory-policy volatile-lfu
    volumes:
      - edge_redis_data:/data

  analytics-redis:
    image: redis:7-alpine
    container_name: analytics-redis
    command: >
      redis-server
      --appendonly yes 
      --appendfsync everysec 
      --maxmemory-policy volatile-lfu
    volumes:
      - analytics_redis_data:/data

  nats:
    image: nats:2.10-alpine
    container_name: nats
    command: ["-js"]
    ports:
      - "4222:4222"

  hub-server:
    build:
      context: ..                   # Points to the 'gate/' root directory
      dockerfile: deployments/hub.Dockerfile
    container_name: hub-server
    depends_on:
      - hub-redis
      - nats
    environment:
      - REDIS_ADDR=hub-redis:6379
      - CONFIG_FILE_PATH=/cmd/config.json
      - HUB_AUTH_TOKEN=${HUB_AUTH_TOKEN:?HUB_AUTH_TOKEN is required}
      - HUB_ENFORCE_REDIS_NOEVICTION=true
      - HUB_GRPC_PORT=9090
      - HUB_TLS_CERT_FILE=/certs/hub/tls.crt
      - HUB_TLS_KEY_FILE=/certs/hub/tls.key
      - HUB_TLS_CA_FILE=/certs/ca/ca.crt
      - HUB_CONFIG_RELOAD_CHANNEL=gate:config:reload
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_TIER_UPDATES_SUBJECT=${NATS_TIER_UPDATES_SUBJECT:-tier.updates}
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./certs/hub:/certs/hub:ro
      - ./certs/ca:/certs/ca:ro

  edge-server:
    build:
      context: ..
      dockerfile: deployments/edge.Dockerfile
    container_name: edge-server
    depends_on:
      - hub-server
      - edge-redis
      - nats
    environment:
      - REDIS_ADDR=edge-redis:6379
      - HUB_ADDR=http://hub-server:8080
      - HUB_GRPC_ADDR=hub-server:9090
      - HUB_GRPC_SERVER_NAME=hub-server
      - HUB_AUTH_TOKEN=${HUB_AUTH_TOKEN:?HUB_AUTH_TOKEN is required}
      - EDGE_TLS_CERT_FILE=/certs/edge/tls.crt
      - EDGE_TLS_KEY_FILE=/certs/edge/tls.key
      - EDGE_TLS_CA_FILE=/certs/ca/ca.crt
      - EDGE_CONFIG_RELOAD_CHANNEL=gate:config:reload
      - EDGE_MAX_DELTA=${EDGE_MAX_DELTA:-100}
      - ANALYTICS_BUFFER_SIZE=${ANALYTICS_BUFFER_SIZE:-1000}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_TIER_UPDATES_SUBJECT=${NATS_TIER_UPDATES_SUBJECT:-tier.updates}
      - NATS_EDGE_QUEUE=${NATS_EDGE_QUEUE:-edge-tier-updates}
      - NATS_ANALYTICS_SUBJECT=${NATS_ANALYTICS_SUBJECT:-analytics.events}
      - PORT=:8080
    ports:
      - "8082:8080"
    volumes:
      - ./certs/edge:/certs/edge:ro
      - ./certs/ca:/certs/ca:ro

  analytics:
    build:
      context: ..
      dockerfile: deployments/analytics.Dockerfile
    container_name: analytics-api
    depends_on:
      - nats
      - analytics-redis
    environment:
      - PORT=:8091
      - REDIS_ADDR=analytics-redis:6379
      - ANALYTICS_API_TOKEN=${ANALYTICS_API_TOKEN:?ANALYTICS_API_TOKEN is required}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_ANALYTICS_SUBJECT=${NATS_ANALYTICS_SUBJECT:-analytics.events}
      - NATS_ANALYTICS_QUEUE=${NATS_ANALYTICS_QUEUE:-analytics-subscribers}
    ports:
      - "8091:8091"

volumes:
  hub_redis_data:
  edge_redis_data:
  analytics_redis_data: