syntax = "proto3";

// The hub <-> edge protocol. Each edge holds one mTLS connection to a hub and
// uses it for everything: leasing quota, resolving API keys, and watching for
// config and tier changes.
package gate.quota.v1;

option go_package = "gateway/packages/common/types;types";

message QuotaLeaseRequest {
  string prefix = 1;
  string service_id = 2;
  string api_key = 3;
  int64 requested_tokens = 4;
  // tier_id is the tier the edge resolved. The hub trusts it only for
  // services whose callers are not API keys (jwt, none); for API keys it
  // uses its own record.
  string tier_id = 5;
  // limit_id names the limit: empty is the caller's tier limit, anything
  // else one of the service's additional limits. The hub resolves the quota
  // itself; an edge never sends one.
  string limit_id = 6;
  // edge_id identifies the edge, so the hub can split the last of a quota
  // fairly between the edges actively spending it.
  string edge_id = 7;
  // observed_rate is the cost per second this edge has been spending on the
  // quota; the hub sizes adaptive grants from it.
  double observed_rate = 8;
  // org is the caller's organisation as the edge resolved it (a JWT claim).
  // Like tier_id, the hub trusts it only for services without API keys.
  string org = 9;
}

message QuotaLeaseResponse {
  int64 granted_tokens = 1;
  int64 lease_ttl_seconds = 2;
  int64 remaining_global = 3;
  // waiting_for_capacity is true when the Hub has zero quota available.
  // The Edge must enter WAITING state and short-circuit all traffic with 429.
  bool waiting_for_capacity = 4;
  // retry_after_ms is the Hub's hint for when the Edge should retry the lease
  // request. Only set when waiting_for_capacity is true.
  int64 retry_after_ms = 5;
  // The hub's clock defines windows. window_id names the window the tokens
  // belong to; expires_in_ms and reset_in_ms are measured from when the hub
  // made the grant, so they hold whatever the edge's clock says.
  int64 window_id = 6;
  int64 expires_in_ms = 7; // the tokens' remaining lifetime
  int64 reset_in_ms = 8;   // until the quota is whole again
  int64 active_edges = 9;  // edges sharing the quota right now
  int64 parent_window_id = 10;
  int64 limit = 11;        // the quota the hub enforced
}

// A batch of lease requests answered in one round trip. Results are in
// request order; a failed item carries a gRPC status code and message.
message QuotaLeaseBatchRequest {
  repeated QuotaLeaseRequest requests = 1;
}

message QuotaLeaseResult {
  QuotaLeaseResponse response = 1;
  int32 code = 2; // google.rpc.Code; 0 is OK
  string message = 3;
}

message QuotaLeaseBatchResponse {
  repeated QuotaLeaseResult results = 1;
}

// LeaseReturn gives unspent tokens back to the window they were granted in.
// Negative tokens settle debt from post-hoc costs.
message LeaseReturn {
  string prefix = 1;
  string service_id = 2;
  string api_key = 3;
  string limit_id = 4;
  string tier_id = 5;
  string org = 6;
  int64 window_id = 7;
  int64 parent_window_id = 8;
  int64 tokens = 9;
}

message ReturnLeasesRequest {
  string edge_id = 1;
  // dedupe makes a retried call apply once.
  string dedupe = 2;
  repeated LeaseReturn returns = 3;
}

message ReturnLeasesResponse {}

service QuotaLeaseService {
  rpc RequestQuotaLease(QuotaLeaseRequest) returns (QuotaLeaseResponse);
  rpc RequestQuotaLeases(QuotaLeaseBatchRequest) returns (QuotaLeaseBatchResponse);
  rpc ReturnLeases(ReturnLeasesRequest) returns (ReturnLeasesResponse);
}

message WatchRequest {
  string edge_id = 1;
}

// ControlEvent is one change pushed to a watching edge. Every stream starts
// with a ConfigSnapshot; a new stream after a reconnect starts with one too,
// so an edge that missed events simply resynchronises.
message ControlEvent {
  oneof event {
    ConfigSnapshot config = 1;
    TierChange tier = 2;
  }
}

message ConfigSnapshot {
  // The compiled gateway config as JSON (types.GatewayConfig).
  bytes config_json = 1;
  // Response-cache scopes made stale by this config (empty on the first
  // snapshot of a stream).
  repeated CacheScope invalidate = 2;
  // reset_tiers tells the edge to revalidate every cached key tier: the
  // stream is new, so tier changes may have been missed.
  bool reset_tiers = 3;
}

message CacheScope {
  string prefix = 1;
  string service_id = 2; // empty: the whole prefix
}

// TierChange reports a key's new tier; an empty tier_id means revoked.
message TierChange {
  string prefix = 1;
  string api_key = 2;
  string tier_id = 3;
}

message ResolveKeyRequest {
  string prefix = 1;
  string api_key = 2;
}

message ResolveKeyResponse {
  string tier_id = 1; // empty: the key is unknown
  string org = 2;     // the key's organisation, if it has one
}

service ControlPlane {
  rpc Watch(WatchRequest) returns (stream ControlEvent);
  rpc ResolveKey(ResolveKeyRequest) returns (ResolveKeyResponse);
}
