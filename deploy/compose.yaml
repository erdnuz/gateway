# Gate local stack. Start with `make up` (or `bash scripts/dev.sh up`).
#
#   default            hub + Redis, edge, echo upstream
#   --profile analytics  + NATS, ClickHouse and the analytics API/dashboard
#   --profile observability  + Prometheus, Grafana (Gate overview dashboard)
#                            and Jaeger; set GATE_OTLP=http://jaeger:4317 to trace
#
# Edges hold one mTLS gRPC connection to the hub and keep their caches in
# memory, so scaling out is `docker compose up --scale edge=N` behind a
# load balancer (drop the fixed port mapping first).
#   --profile demo       + a traffic generator that exercises every tier
#
# Ports: gateway :8080, hub API :8081, analytics :8091, Grafana :3000,
# Prometheus :9090, Jaeger :16686. Every Gate container serves /metrics on
# :9100 inside the network.
name: gate

x-gate: &gate
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: gate
  image: gate:local
  restart: unless-stopped

x-ready: &ready
  interval: 2s
  timeout: 2s
  retries: 30

x-env: &common-env
  NATS_URL: nats://nats:4222
  OTEL_EXPORTER_OTLP_ENDPOINT: ${GATE_OTLP:-}
  OTEL_EXPORTER_OTLP_INSECURE: "true"

services:
  # Generates a throwaway CA plus hub (server) and edge (client) certs on first
  # start; later starts reuse the volume.
  certs:
    image: alpine:3.20
    volumes:
      - certs:/certs
      - ./gen-dev-certs.sh:/scripts/gen-dev-certs.sh:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /certs/edge/tls.crt ] ||
        (apk add --no-cache -q bash openssl >/dev/null &&
        GEN_CERTS_IN_CONTAINER=1 bash /scripts/gen-dev-certs.sh /certs hub,localhost &&
        chmod -R a+rX /certs)

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], <<: *ready }

  nats:
    profiles: ["analytics"]
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"], <<: *ready }

  hub:
    <<: *gate
    command: ["hub"]
    environment:
      <<: *common-env
      PORT: "8080"
      HUB_GRPC_PORT: "9090"
      HUB_AUTH_TOKEN: ${GATE_HUB_TOKEN:-gate-local-token}
      CONFIG_FILE_PATH: /etc/gate/gateway.yaml
      REDIS_ADDR: redis:6379
      HUB_TLS_CERT_FILE: /certs/hub/tls.crt
      HUB_TLS_KEY_FILE: /certs/hub/tls.key
      HUB_TLS_CA_FILE: /certs/ca/ca.crt
    volumes:
      - ${GATE_CONFIG:-./gateway.yaml}:/etc/gate/gateway.yaml:ro
      - certs:/certs:ro
    ports: ["8081:8080"]
    depends_on:
      certs: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"], <<: *ready }

  edge:
    <<: *gate
    command: ["edge"]
    environment:
      <<: *common-env
      PORT: "8080"
      EDGE_ID: edge-1
      HUB_GRPC_ADDR: hub:9090
      HUB_GRPC_SERVER_NAME: hub
      EDGE_TLS_CERT_FILE: /certs/edge/tls.crt
      EDGE_TLS_KEY_FILE: /certs/edge/tls.key
      EDGE_TLS_CA_FILE: /certs/ca/ca.crt
    volumes: ["certs:/certs:ro"]
    ports: ["8080:8080"]
    depends_on:
      hub: { condition: service_healthy }
      echo: { condition: service_started }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"], <<: *ready }

  # Demo upstream: answers every request with a JSON description of it.
  echo:
    <<: *gate
    command: ["echo", "-addr", ":9000", "-name", "echo"]

  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: gate
      CLICKHOUSE_USER: gate
      CLICKHOUSE_PASSWORD: gate
    volumes: [clickhouse:/var/lib/clickhouse]
    # 127.0.0.1, not localhost: the image does not listen on ::1.
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"], start_period: 30s, <<: *ready }

  analytics:
    <<: *gate
    profiles: ["analytics"]
    command: ["analytics"]
    environment:
      <<: *common-env
      PORT: "8091"
      HUB_ADDR: http://hub:8080
      HUB_AUTH_TOKEN: ${GATE_HUB_TOKEN:-gate-local-token}
      CLICKHOUSE_DSN: clickhouse://gate:gate@clickhouse:9000/gate
      PROMETHEUS_URL: http://prometheus:9090   # dashboard scaling strip (observability profile)
    ports: ["8091:8091"]
    depends_on:
      hub: { condition: service_healthy }
      nats: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8091/readyz"], <<: *ready }

  # Seeds demo keys, then sends steady traffic across tiers (some of it over
  # quota, so 429s show up in analytics).
  traffic:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: tools
    image: gate-tools:local
    restart: unless-stopped
    entrypoint: ["loadgen"]
    command: ["-scenario", "demo", "-edges", "http://edge:8080", "-hub", "http://hub:8080", "-prefix", "v1", "-service", "echo"]
    environment:
      HUB_AUTH_TOKEN: ${GATE_HUB_TOKEN:-gate-local-token}
    depends_on:
      edge: { condition: service_healthy }

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gate-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.72.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

volumes:
  certs:
  redis:
  clickhouse:
