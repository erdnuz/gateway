# Scrapes every Gate component. DNS discovery returns one address per
# replica, so `docker compose up --scale edge=N` is picked up automatically.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: edge
    dns_sd_configs: [{ names: [edge], type: A, port: 9100 }]
  - job_name: hub
    dns_sd_configs: [{ names: [hub], type: A, port: 9100 }]
  - job_name: analytics
    dns_sd_configs: [{ names: [analytics], type: A, port: 9100 }]
