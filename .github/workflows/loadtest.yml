name: Load test

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loadtest:
    name: Full e2e load test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash testing/loadtest/run.sh nightly
      - name: Report
        if: always()
        run: cat testing/loadtest/results/nightly/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fail on any failed scenario
        run: "! grep -q '^- failed: [^n]' testing/loadtest/results/nightly/report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-nightly-${{ github.run_id }}
          path: testing/loadtest/results/nightly/
