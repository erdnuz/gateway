name: CI

on:
  push:
    branches: [master, gate-v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go vet -tags integration ./testing/integration/
      - uses: golangci/golangci-lint-action@v8
        # goinstall: the prebuilt binaries lag Go releases and refuse a newer go.mod.
        with: { version: v2.14.0, install-mode: goinstall }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Generated code is current
        run: |
          go test ./packages/config -run Golden -args -update
          git diff --exit-code schema/

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -tags integration -count=1 -timeout 25m ./testing/integration/...

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gate
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  loadtest-smoke:
    name: Rate-limiter e2e (correctness)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Correctness scenarios
        env:
          ONLY: windows carryover isolation bypass propagation outage
        run: bash testing/loadtest/run.sh ci
      - name: Report
        if: always()
        run: cat testing/loadtest/results/ci/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fail on any failed scenario
        run: "! grep -q '^- failed: [^n]' testing/loadtest/results/ci/report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-ci
          path: testing/loadtest/results/ci/
